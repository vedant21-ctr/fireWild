# Tabular models. Hyperparameters are selected per protocol on its validation split.
seed: 42
neg_rate: 0.02
rf_rows: 400000
random_forest: {n_estimators: 200, max_depth: 20, min_samples_leaf: 50, max_features: sqrt}
logistic_regression: {C: 1.0, max_iter: 2000}
lightgbm:
  common: {objective: binary, learning_rate: 0.05, n_estimators: 3000, subsample: 0.8, subsample_freq: 1,
           colsample_bytree: 0.5, reg_lambda: 1.0, metric: average_precision, verbose: -1}
  early_stopping_rounds: 100
  grid:
    - {num_leaves: 31, min_child_samples: 2000}
    - {num_leaves: 63, min_child_samples: 2000}
    - {num_leaves: 127, min_child_samples: 5000}
xgboost:
  common: {learning_rate: 0.05, n_estimators: 3000, subsample: 0.8, colsample_bytree: 0.5, reg_lambda: 1.0,
           tree_method: hist, eval_metric: aucpr, early_stopping_rounds: 100}
  grid:
    - {max_depth: 6, min_child_weight: 100}
    - {max_depth: 8, min_child_weight: 1000}
evaluation: {n_boot: 500, fpr_levels: [0.01, 0.05]}
